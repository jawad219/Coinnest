<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoinNest Admin</title>
<style>
:root{--bg:#EEF2F0;--ink:#14332B;--card:#fff;--coin:#F2B632;--red:#E4572E;--mut:#5d7a70;font-family:system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0F2620;--ink:#E6F3EC;--card:#173A30;--mut:#8fb0a3}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);padding:12px}main{max-width:900px;margin:auto}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px;margin:10px 0}
button,input{font:inherit;color:inherit}button{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:8px 12px;cursor:pointer;margin:2px}button.g{background:var(--coin);color:#14332B}button.r{background:var(--red);color:#fff}
input{padding:8px;border:2px solid var(--ink);border-radius:10px;background:var(--card);margin:3px 0;width:100%}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button.on{background:var(--coin);color:#14332B}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.grid b{font-size:28px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--mut);text-align:left;white-space:nowrap}.mut{color:var(--mut)}
#toast{position:fixed;top:10px;right:10px;background:var(--red);color:#fff;padding:8px 14px;border-radius:10px;display:none}
</style></head><body><div id="toast"></div><main id="m"></main>
<script src="server.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PW=sessionStorage.getItem('cn_pw'),tab='stats';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
async function api(a,p){try{return await API.call('adm_'+a,p,PW)}catch(e){toast(e);if(/password/i.test(e)){PW=null;sessionStorage.removeItem('cn_pw');boot()}throw e}}
function boot(){if(!PW){$('#m').innerHTML='<div class="card" style="max-width:340px;margin:12vh auto"><h2>CoinNest Admin</h2><input id="pw" type="password" placeholder="Admin password"><button class="g" onclick="login()">Login</button><p class="mut">Default password: admin123 (Settings mein badal do)</p></div>';return}
$('#m').innerHTML='<div class="tabs">'+[['stats','Stats'],['users','Users'],['wds','Withdrawals'],['promos','Promo codes'],['cfg','Settings']].map(x=>`<button class="${x[0]==tab?'on':''}" onclick="tab='${x[0]}';boot()">${x[1]}</button>`).join('')+'<button onclick="PW=null;sessionStorage.clear();boot()">Logout</button></div><div id="v"></div>';V[tab]().catch(()=>{})}
async function login(){PW=$('#pw').value;try{await API.call('adm_stats',{},PW);sessionStorage.setItem('cn_pw',PW);boot()}catch(e){PW=null;toast(e)}}
const V={
async stats(){const s=await api('stats');$('#v').innerHTML=`<div class="grid">${[['Users',s.users],['Coins held',s.coins],['Pending withdrawals',s.pending],['Paid (Rs)',s.paid]].map(x=>`<div class="card"><span class="mut">${x[0]}</span><br><b>${x[1]}</b></div>`).join('')}</div>`},
async users(){const u=await api('users');$('#v').innerHTML=`<div class="card wrap"><table><tr><th>Name</th><th>Email</th><th>Coins</th><th>Refs</th><th>Status</th><th></th></tr>${u.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${x.coins}</td><td>${x.refs}</td><td>${x.ban?'<b style="color:var(--red)">blocked</b>':'active'}</td><td><button class="${x.ban?'g':'r'}" onclick="ban('${x.id}')">${x.ban?'Unblock':'Block'}</button><button onclick="adj('${x.id}')">± Coins</button></td></tr>`).join('')}</table></div>`},
async wds(){const w=await api('wds');$('#v').innerHTML=`<div class="card wrap"><table><tr><th>#</th><th>User</th><th>Rs</th><th>Method</th><th>Account</th><th>Status</th><th></th></tr>${w.map(x=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${x.rs}</td><td>${esc(x.method)}</td><td>${esc(x.acct)}</td><td>${x.st}</td><td>${x.st=='pending'?`<button class="g" onclick="wd(${x.id},true)">Mark paid</button><button class="r" onclick="wd(${x.id},false)">Reject</button>`:''}</td></tr>`).join('')}</table>${w.length?'':'<p class="mut">No requests yet</p>'}</div>`},
async promos(){const p=await api('promos');$('#v').innerHTML=`<div class="card"><b>New promo code</b><input id="pc" placeholder="CODE"><input id="pco" type="number" placeholder="Coins"><input id="pl" type="number" placeholder="Max uses"><button class="g" onclick="addP()">Create</button></div><div class="card wrap"><table><tr><th>Code</th><th>Coins</th><th>Used</th><th></th></tr>${Object.entries(p).map(([k,x])=>`<tr><td>${esc(k)}</td><td>${x.coins}</td><td>${x.used}/${x.limit}</td><td><button class="r" onclick="api('promoDel',{code:'${esc(k)}'}).then(boot)">Delete</button></td></tr>`).join('')}</table></div>`},
async cfg(){const c=await api('cfg');$('#v').innerHTML=`<div class="card"><b>Settings</b><p class="mut">Rs 1 = cpr coins. Sab limits daily hain.</p>${Object.entries(c).filter(([k,v])=>typeof v==='number').map(([k,v])=>`<label class="mut">${k}</label><input data-k="${k}" type="number" value="${v}">`).join('')}<label class="mut">Notice for users</label><input id="nt" value="${esc(c.notice)}"><label><input id="off" type="checkbox" style="width:auto" ${c.off?'checked':''}> Maintenance mode</label><label class="mut">New admin password</label><input id="np" type="password" placeholder="Leave empty to keep"><button class="g" onclick="save()">Save settings</button></div>`}};
async function ban(id){await api('ban',{id});boot()}
async function adj(id){const n=prompt('Coins to add (negative to remove):');if(n===null)return;await api('adjust',{id,n});toast('Done');boot()}
async function wd(id,ok){if(!confirm(ok?'Payment kar di?':'Reject and refund coins?'))return;await api('wdset',{id,ok});boot()}
async function addP(){await api('promoAdd',{code:$('#pc').value,coins:$('#pco').value,limit:$('#pl').value});boot()}
async function save(){const p={notice:$('#nt').value,off:$('#off').checked,pw:$('#np').value};document.querySelectorAll('[data-k]').forEach(i=>p[i.dataset.k]=i.value);await api('cfgSet',p);if(p.pw){PW=p.pw;sessionStorage.setItem('cn_pw',PW)}toast('Saved')}
boot();
</script></body></html>
