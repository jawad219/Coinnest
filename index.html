<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CoinNest</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF4EE;--ink:#14332B;--coin:#F2B632;--red:#E4572E;--mut:#5d7a70;--card:#fff;font-family:'Baloo 2',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F2620;--ink:#E6F3EC;--card:#173A30;--mut:#8fb0a3}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:480px;margin:auto;padding:16px}h2{margin:18px 0 8px;font-size:20px}p{margin:4px 0;color:var(--mut)}
.card{background:var(--card);border-radius:18px;padding:14px;margin:10px 0;border:2px solid var(--ink)}
.bal{background:var(--coin);color:#14332B;border-radius:24px;padding:18px;border:2px solid #14332B;box-shadow:5px 5px 0 #14332B}.bal b{font-size:44px;line-height:1}
button,input{font:inherit;color:inherit}button{background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:10px 16px;cursor:pointer}button:disabled{opacity:.4}
button.g{background:var(--coin);color:#14332B;border:2px solid #14332B}
input,select{width:100%;padding:10px;border-radius:12px;border:2px solid var(--ink);background:var(--card);margin:5px 0;font:inherit;color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px 0}nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 -4px var(--coin)}
#gbox{position:relative;height:280px;overflow:hidden;border-radius:14px;background:#cfe9dd;border:2px solid var(--ink);touch-action:manipulation}
.bl{position:absolute;bottom:-60px;width:52px;height:64px;border-radius:50% 50% 46% 46%;border:2px solid var(--ink);animation:up 3s linear forwards}@keyframes up{to{bottom:300px}}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-90px);background:var(--red);color:#fff;padding:10px 16px;border-radius:14px;transition:.25s;z-index:9;max-width:90%}#toast.show{transform:translate(-50%,0)}
#ad{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center;flex-direction:column;color:#fff;z-index:8;text-align:center}
.pill{display:inline-block;background:var(--coin);color:#14332B;border-radius:99px;padding:2px 10px}.neg{color:var(--red)}
</style></head><body>
<div id="toast"></div><div id="ad"><h2>Test Ad</h2><p style="color:#ccc">Yahan AdMob rewarded ad chalega</p><b id="adt" style="font-size:60px">15</b></div>
<main id="m"></main><nav id="nav" hidden></nav>
<script src="server.js"></script>
<script>
const $=s=>document.querySelector(s),ART=[["Why saving small beats spending big","Small daily savings grow faster than most people expect. Set aside a fixed amount as soon as money arrives, and treat the rest as your spending budget."],["How to spot a fake earning app","Real apps never ask you to pay first. Be careful of any app that promises huge money for no work, or asks for your password or OTP."],["Sleep and focus","Adults do best with seven to nine hours of sleep. A steady bedtime helps memory and mood more than one long weekend lie-in."]];
let T=localStorage.getItem('cn_t'),S=null,tab='home',GT=null,dev=localStorage.cn_dev||(localStorage.cn_dev=Math.random().toString(36).slice(2));
function toast(m){const t=$('#toast');t.textContent=m;t.className='show';setTimeout(()=>t.className='',2600)}
async function api(a,p){try{return await API.call(a,p,T)}catch(e){toast(e);if(/login/i.test(e)){T=null;localStorage.removeItem('cn_t');boot()}throw e}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function boot(){if(!T){$('#nav').hidden=true;$('#m').innerHTML=`<div class="bal" style="margin-top:8vh"><b>CoinNest</b><p style="color:#14332B">Play, read, watch and earn coins.</p></div><div class="card"><input id="n" placeholder="Your name"><input id="e" type="email" placeholder="Email"><input id="r" placeholder="Referral code (optional)"><button class="g" style="width:100%;margin-top:8px" onclick="login()">Continue with Google (test)</button><p>Real Google login will be added after the APK is built.</p></div>`;return}
try{S=await api('me');$('#nav').hidden=false;show(tab)}catch(e){}}
async function login(){try{const r=await API.call('login',{name:$('#n').value,email:$('#e').value,ref:$('#r').value,dev});T=r.t;localStorage.setItem('cn_t',T);boot()}catch(e){toast(e)}}
async function refresh(){S=await api('me')}
function show(t){tab=t;clearInterval(GT);$('#nav').innerHTML=[['home','Home'],['earn','Earn'],['wallet','Wallet']].map(x=>`<button class="${x[0]==t?'on':''}" onclick="show('${x[0]}')">${x[1]}</button>`).join('');V[t]()}
const bal=()=>`<div class="bal"><p style="color:#14332B">Hi ${esc(S.u.name)}</p><b>${S.u.coins.toLocaleString()}</b> coins<p style="color:#14332B">= Rs ${(S.u.coins/S.cfg.cpr).toFixed(2)}</p></div>`;
const V={
async home(){const u=S.u,b=await API.call('board');$('#m').innerHTML=bal()+(S.cfg.notice?`<div class="card">📢 ${esc(S.cfg.notice)}</div>`:'')+`<div class="card row"><div><b>Daily check-in</b><p>Streak: ${u.streak} day(s)</p></div><button class="g" ${u.last===new Date().toISOString().slice(0,10)?'disabled':''} onclick="doCI()">Claim</button></div>
<div class="card"><b>Invite friends</b><p>Both get ${S.cfg.ref} coins. Your code:</p><div class="row"><span class="pill">${u.code}</span><button onclick="navigator.clipboard&&navigator.clipboard.writeText('${u.code}');toast('Copied')">Copy</button></div><p>Friends joined: ${u.refs}</p></div>
<h2>Leaderboard</h2><div class="card">${b.map((x,i)=>`<div class="row"><span>${i+1}. ${esc(x.n)}</span><b>${x.c}</b></div>`).join('')||'<p>No players yet</p>'}</div><button onclick="T=null;localStorage.removeItem('cn_t');boot()">Log out</button>`},
earn(){const c=S.cfg,d=S.d;$('#m').innerHTML=bal()+`<div class="card"><b>Balloon pop</b><p>10 seconds. ${c.pop} coin per pop. Plays today: ${d.pl||0}/${c.plays}</p><button class="g" onclick="game()">Play</button><div id="gbox" hidden></div></div>
<div class="card row"><div><b>Watch an ad</b><p>+${c.adCoins} coins · ${d.ad||0}/${c.adDaily} today</p></div><button class="g" onclick="doAd()">Watch</button></div>
<h2>Articles (+${c.artCoins} coins each)</h2>${ART.map((a,i)=>`<div class="card"><b>${a[0]}</b><p>${(d.art||[]).includes(i)?'Done ✓':''}</p>${(d.art||[]).includes(i)?'':`<button onclick="read(${i})">Read</button>`}</div>`).join('')}
<h2>Promo code</h2><div class="card row"><input id="pc" placeholder="Enter code"><button onclick="doPromo()">Apply</button></div>`},
async wallet(){const w=await api('mywd'),c=S.cfg;$('#m').innerHTML=bal()+`<div class="card"><b>Withdraw</b><p>Minimum Rs ${c.minRs} · Rs 1 = ${c.cpr} coins</p><input id="rs" type="number" placeholder="Amount in Rs"><select id="mt"><option>JazzCash</option><option>EasyPaisa</option><option>Bank</option></select><input id="ac" placeholder="Account number"><button class="g" onclick="doWd()">Request withdraw</button></div>
<h2>Requests</h2>${w.map(x=>`<div class="card row"><span>Rs ${x.rs} · ${x.method}</span><b class="${x.st=='rejected'?'neg':''}">${x.st}</b></div>`).join('')||'<p>No requests yet</p>'}<h2>History</h2>${S.u.log.map(x=>`<div class="row"><span>${esc(x.w)}</span><b class="${x.n<0?'neg':''}">${x.n>0?'+':''}${x.n}</b></div>`).join('')||'<p>Nothing yet</p>'}`}};
const done=async m=>{await refresh();toast(m);show(tab)};
async function doCI(){const r=await api('checkin');done('+'+r.c+' coins')}
async function doPromo(){const r=await api('promo',{code:$('#pc').value});done('+'+r.c+' coins')}
async function doWd(){await api('wd',{rs:$('#rs').value,method:$('#mt').value,acct:$('#ac').value});done('Request sent')}
function showAd(){return new Promise(r=>{if(window.Android&&Android.showRewarded){window.onAdDone=r;Android.showRewarded();return}const o=$('#ad');o.style.display='flex';let s=S.cfg.adSecs;$('#adt').textContent=s;const i=setInterval(()=>{$('#adt').textContent=--s;if(s<=0){clearInterval(i);o.style.display='none';r()}},1000)})}
async function doAd(){await api('ads');await showAd();const r=await api('adc');done('+'+r.c+' coins')}
async function read(i){await api('as',{id:i});const o=$('#ad');o.style.display='flex';o.innerHTML=`<div style="padding:24px;max-width:440px"><h2>${ART[i][0]}</h2><p style="color:#ddd">${ART[i][1]}</p><b id="adt" style="font-size:40px">${S.cfg.artSecs}</b><br><button id="rb" class="g" disabled>Claim coins</button></div>`;let s=S.cfg.artSecs;const t=setInterval(()=>{$('#adt').textContent=--s;if(s<=0){clearInterval(t);$('#rb').disabled=false}},1000);
$('#rb').onclick=async()=>{o.style.display='none';o.innerHTML='<h2>Test Ad</h2><p style="color:#ccc">Yahan AdMob rewarded ad chalega</p><b id="adt" style="font-size:60px">15</b>';const r=await api('ac');done('+'+r.c+' coins')}}
async function game(){await api('gs');const b=$('#gbox');b.hidden=false;b.innerHTML='';let n=0,left=10;const col=['#F2B632','#E4572E','#5fb98f','#7fa7e8'];
const sp=setInterval(()=>{const e=document.createElement('div');e.className='bl';e.style.left=Math.random()*85+'%';e.style.background=col[Math.random()*4|0];e.onpointerdown=()=>{n++;e.remove();$('#gt').textContent=`Time ${left}s · Pops ${n}`};b.appendChild(e);setTimeout(()=>e.remove(),3000)},380);
b.insertAdjacentHTML('afterbegin','<b id="gt" style="position:absolute;left:10px;top:6px;z-index:2">Time 10s · Pops 0</b>');
GT=setInterval(async()=>{left--;$('#gt')&&($('#gt').textContent=`Time ${left}s · Pops ${n}`);if(left<=0){clearInterval(GT);clearInterval(sp);const r=await api('ge',{pops:n});done('+'+r.c+' coins')}},1000)}
boot();
</script></body></html>
